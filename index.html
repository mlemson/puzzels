<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f3f0e8" />
  <title>Puzzelhub</title>
  <script>
    (function(){
      try {
        const saved=localStorage.getItem('puzzelhub.theme');
        const theme=saved || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
        document.documentElement.dataset.theme=theme;
      } catch(e) {}
    })();
  </script>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" id="brandButton" type="button" aria-label="Naar Puzzelhub">
        <span class="brand-mark">P</span>
        <span><strong>Puzzelhub</strong><small>rustige logica, één level tegelijk</small></span>
      </button>
      <div class="topbar-actions">
        <span class="progress-chip" id="globalProgress">0 opgelost</span>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Wissel kleurmodus" title="Wissel kleurmodus">◐</button>
      </div>
    </header>
    <main id="app" class="app"></main>
  </div>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/puzzlekit.js"></script>
  <script src="games/tectonic/levels.js"></script>
  <script src="games/tectonic/tectonic.js"></script>
  <script src="games/swedish/levels.js"></script>
  <script src="games/swedish/swedish.js"></script>
  <script src="games/logic-pack.js"></script>
  <script src="js/daily.js"></script>
</body>
</html>
